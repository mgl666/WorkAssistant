services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-work_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-work_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.server 中设置 POSTGRES_PASSWORD}
    volumes:
      - work_assistant_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-work_assistant}
      PGUSER: ${POSTGRES_USER:-work_assistant}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env.server 中设置 POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  work_assistant_db:
